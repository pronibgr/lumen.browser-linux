<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15181e"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <radialGradient id="lensCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#13161c"/>
      <stop offset="85%" stop-color="#0e1015"/>
      <stop offset="100%" stop-color="#07080b"/>
    </radialGradient>

    <radialGradient id="innerAtmosphere" cx="50%" cy="92%" r="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="18%" stop-color="#f8fafc" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#cbd5e1" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#5eead4" stop-opacity="0.03"/>
      <stop offset="95%" stop-color="#0e1015" stop-opacity="0.005"/>
      <stop offset="100%" stop-color="#0e1015" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0"/>
      <stop offset="20%" stop-color="#e2e8f0" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#e2e8f0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bloom" cx="50%" cy="26%" r="35%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0e1015" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#tileBg)" stroke="#222733" stroke-width="1.5"/>

  <circle cx="256" cy="256" r="142" fill="url(#bloom)"/>

  <circle cx="256" cy="256" r="130" fill="url(#lensCore)"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#181c24" stroke-width="1"/>

  <circle cx="256" cy="256" r="122" fill="url(#innerAtmosphere)"/>

  <path d="M 134 256 A 122 122 0 0 1 378 256" 
        fill="none" 
        stroke="url(#rimLight)" 
        stroke-width="2.8" 
        stroke-linecap="round"/>
